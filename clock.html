<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Clock - Time Zones</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 1200px;
}

.header {
  text-align: center;
  color: white;
  margin-bottom: 40px;
  animation: slideDown 0.5s ease;
}

.header h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

.header p {
  font-size: 14px;
  opacity: 0.8;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
  justify-content: center;
}

.search-box input {
  padding: 12px 20px;
  border: 2px solid #0f3460;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.1);
  color: white;
  font-size: 14px;
  min-width: 250px;
}

.search-box input::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

.search-box input:focus {
  outline: none;
  border-color: #00d4ff;
  background: rgba(255, 255, 255, 0.15);
}

.search-box button {
  padding: 12px 25px;
  background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}

.search-box button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
}

.clocks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
  margin-bottom: 20px;
}

.clock-card {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
  border: 2px solid rgba(0, 212, 255, 0.3);
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  animation: slideUp 0.5s ease;
  backdrop-filter: blur(10px);
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.clock-card:hover {
  border-color: rgba(0, 212, 255, 0.8);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
  transform: translateY(-5px);
}

.clock-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, #00d4ff, transparent);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% {
    left: -100%;
  }
  100% {
    left: 100%;
  }
}

.city-name {
  color: #00d4ff;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 15px;
  font-weight: 600;
}

.timezone {
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  margin-bottom: 10px;
}

.digital-time {
  font-size: 2.5rem;
  font-weight: 700;
  color: white;
  font-family: 'Courier New', monospace;
  letter-spacing: 2px;
  margin: 15px 0;
}

.analog-clock {
  width: 120px;
  height: 120px;
  border: 3px solid rgba(0, 212, 255, 0.5);
  border-radius: 50%;
  margin: 15px auto;
  position: relative;
  background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 100%);
}

.clock-center {
  width: 10px;
  height: 10px;
  background: #00d4ff;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
}

.hand {
  position: absolute;
  bottom: 50%;
  left: 50%;
  transform-origin: bottom center;
  background: #00d4ff;
  border-radius: 10px;
}

.hour-hand {
  width: 4px;
  height: 30px;
  margin-left: -2px;
}

.minute-hand {
  width: 3px;
  height: 40px;
  margin-left: -1.5px;
  opacity: 0.8;
}

.second-hand {
  width: 2px;
  height: 45px;
  margin-left: -1px;
  background: #ff6b9d;
}

.date-info {
  color: rgba(255, 255, 255, 0.7);
  font-size: 12px;
  margin-top: 15px;
}

.remove-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  background: rgba(255, 107, 157, 0.3);
  border: none;
  color: #ff6b9d;
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.3s;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.remove-btn:hover {
  background: rgba(255, 107, 157, 0.6);
  transform: scale(1.1);
}

.empty-state {
  text-align: center;
  color: rgba(255, 255, 255, 0.6);
  padding: 60px 20px;
}

.empty-state-icon {
  font-size: 80px;
  margin-bottom: 20px;
}

.empty-state p {
  font-size: 18px;
  margin-bottom: 10px;
}

.footer {
  text-align: center;
  color: rgba(255, 255, 255, 0.5);
  font-size: 12px;
  margin-top: 40px;
}

.preset-cities {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.preset-btn {
  padding: 8px 16px;
  background: rgba(0, 212, 255, 0.2);
  border: 1px solid rgba(0, 212, 255, 0.5);
  color: #00d4ff;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.3s;
}

.preset-btn:hover {
  background: rgba(0, 212, 255, 0.4);
  border-color: #00d4ff;
}

@media (max-width: 600px) {
  .header h1 {
    font-size: 1.8rem;
  }

  .digital-time {
    font-size: 2rem;
  }

  .search-box {
    flex-direction: column;
  }

  .search-box input {
    min-width: 100%;
  }

  .search-box button {
    width: 100%;
  }

  .clocks-grid {
    grid-template-columns: 1fr;
  }

  .preset-cities {
    flex-direction: column;
  }

  .preset-btn {
    width: 100%;
  }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🌍 World Clock</h1>
    <p>Current time in different time zones</p>
  </div>

  <div class="search-box">
    <input 
      type="text" 
      id="cityInput" 
      placeholder="Search for a city (e.g., Tokyo, London, New York)..."
      autocomplete="off"
    >
    <button onclick="addClock()">Add Clock</button>
  </div>

  <div class="preset-cities">
    <button class="preset-btn" onclick="addPresetCity('New York')">📍 New York</button>
    <button class="preset-btn" onclick="addPresetCity('London')">📍 London</button>
    <button class="preset-btn" onclick="addPresetCity('Tokyo')">📍 Tokyo</button>
    <button class="preset-btn" onclick="addPresetCity('Dubai')">📍 Dubai</button>
    <button class="preset-btn" onclick="addPresetCity('Sydney')">📍 Sydney</button>
    <button class="preset-btn" onclick="addPresetCity('Paris')">📍 Paris</button>
  </div>

  <div class="clocks-grid" id="clocksGrid">
    <div class="empty-state">
      <div class="empty-state-icon">🕐</div>
      <p>No clocks added yet</p>
      <p style="font-size: 13px;">Add a city to get started!</p>
    </div>
  </div>

  <div class="footer">
    <p>Times update in real-time | Click preset buttons or search for any city worldwide</p>
  </div>
</div>

<script>
// Comprehensive timezone database
const timezoneData = {
  'New York': 'America/New_York',
  'Los Angeles': 'America/Los_Angeles',
  'Chicago': 'America/Chicago',
  'Denver': 'America/Denver',
  'Toronto': 'America/Toronto',
  'Mexico City': 'America/Mexico_City',
  'London': 'Europe/London',
  'Paris': 'Europe/Paris',
  'Berlin': 'Europe/Berlin',
  'Madrid': 'Europe/Madrid',
  'Amsterdam': 'Europe/Amsterdam',
  'Rome': 'Europe/Rome',
  'Moscow': 'Europe/Moscow',
  'Cairo': 'Africa/Cairo',
  'Lagos': 'Africa/Lagos',
  'Dubai': 'Asia/Dubai',
  'Delhi': 'Asia/Kolkata',
  'Bangkok': 'Asia/Bangkok',
  'Hong Kong': 'Asia/Hong_Kong',
  'Shanghai': 'Asia/Shanghai',
  'Tokyo': 'Asia/Tokyo',
  'Seoul': 'Asia/Seoul',
  'Singapore': 'Asia/Singapore',
  'Sydney': 'Australia/Sydney',
  'Melbourne': 'Australia/Melbourne',
  'Auckland': 'Pacific/Auckland',
  'Fiji': 'Pacific/Fiji'
};

let clocks = JSON.parse(localStorage.getItem('clocks')) || ['New York', 'London', 'Tokyo'];

function init() {
  renderClocks();
  updateAllClocks();
  setInterval(updateAllClocks, 1000);
}

function addClock() {
  const input = document.getElementById('cityInput');
  const city = input.value.trim();

  if (!city) {
    alert('Please enter a city name');
    return;
  }

  const foundCity = Object.keys(timezoneData).find(c => 
    c.toLowerCase() === city.toLowerCase()
  );

  if (!foundCity) {
    alert('City not found. Please try another city or use preset buttons.');
    return;
  }

  if (clocks.includes(foundCity)) {
    alert('This city is already added!');
    return;
  }

  clocks.push(foundCity);
  saveClocks();
  input.value = '';
  renderClocks();
}

function addPresetCity(city) {
  if (clocks.includes(city)) {
    alert('This city is already added!');
    return;
  }

  clocks.push(city);
  saveClocks();
  renderClocks();
}

function removeClock(city) {
  clocks = clocks.filter(c => c !== city);
  saveClocks();
  renderClocks();
}

function saveClocks() {
  localStorage.setItem('clocks', JSON.stringify(clocks));
}

function renderClocks() {
  const grid = document.getElementById('clocksGrid');

  if (clocks.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="empty-state-icon">🕐</div>
        <p>No clocks added yet</p>
        <p style="font-size: 13px;">Add a city to get started!</p>
      </div>
    `;
    return;
  }

  grid.innerHTML = clocks.map(city => `
    <div class="clock-card">
      <button class="remove-btn" onclick="removeClock('${city}')">✕</button>
      <div class="city-name">${city}</div>
      <div class="timezone" id="tz-${city}">${timezoneData[city]}</div>
      
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="flex: 1;">
          <div class="digital-time" id="time-${city}">00:00:00</div>
          <div class="date-info" id="date-${city}">Mon, Jan 1</div>
        </div>
        <div class="analog-clock" id="analog-${city}">
          <div class="hand hour-hand" id="hour-${city}"></div>
          <div class="hand minute-hand" id="minute-${city}"></div>
          <div class="hand second-hand" id="second-${city}"></div>
          <div class="clock-center"></div>
        </div>
      </div>
    </div>
  `).join('');
}

function updateAllClocks() {
  clocks.forEach(city => {
    updateClock(city);
  });
}

function updateClock(city) {
  const timezone = timezoneData[city];
  if (!timezone) return;

  try {
    const formatter = new Intl.DateTimeFormat('en-US', {
      timeZone: timezone,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });

    const dateFormatter = new Intl.DateTimeFormat('en-US', {
      timeZone: timezone,
      weekday: 'short',
      month: 'short',
      day: 'numeric'
    });

    const timeParts = formatter.formatToParts(new Date());
    const hour = parseInt(timeParts.find(p => p.type === 'hour').value);
    const minute = parseInt(timeParts.find(p => p.type === 'minute').value);
    const second = parseInt(timeParts.find(p => p.type === 'second').value);

    const timeString = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}:${String(second).padStart(2, '0')}`;
    const dateString = dateFormatter.format(new Date());

    document.getElementById(`time-${city}`).innerText = timeString;
    document.getElementById(`date-${city}`).innerText = dateString;

    // Update analog clock
    const hourDeg = (hour % 12) * 30 + minute * 0.5;
    const minuteDeg = minute * 6 + second * 0.1;
    const secondDeg = second * 6;

    document.getElementById(`hour-${city}`).style.transform = `rotate(${hourDeg}deg)`;
    document.getElementById(`minute-${city}`).style.transform = `rotate(${minuteDeg}deg)`;
    document.getElementById(`second-${city}`).style.transform = `rotate(${secondDeg}deg)`;

  } catch (error) {
    console.error(`Error updating clock for ${city}:`, error);
  }
}

// Setup keyboard support
document.getElementById('cityInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    addClock();
  }
});

// Initialize
window.addEventListener('load', init);
</script>

</body>
</html>
